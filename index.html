
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Game First → 15s Video Overlay</title>
  <style>
    :root{
      --bg: linear-gradient(135deg,#a1c4fd,#c2e9fb); /* Sky gradient */
      --card:#ffffffdd;
      --text:#0f172a;
      --muted:#475569;
      --accent:#3b82f6;
      --win:#22c55e;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    .wrap{min-height:100%;display:flex;flex-direction:column}

    .topbar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.8);backdrop-filter:blur(8px);border-bottom:1px solid rgba(0,0,0,.1);padding:10px 12px;display:flex;gap:10px;align-items:center;justify-content:space-between;border-radius:0 0 14px 14px}
    h1{font-size:16px;margin:0}
    .small{font-size:12px;color:var(--muted)}
    .chip{font-variant-numeric:tabular-nums;padding:6px 10px;border-radius:10px;border:1px solid rgba(59,130,246,.35);color:var(--accent);background:#eff6ff}

    .card{width:100%;max-width:520px;margin:14px auto 24px;background:var(--card);border:1px solid rgba(0,0,0,.08);border-radius:18px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
    .hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:14px;margin:6px 0 10px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .cell{aspect-ratio:1;display:grid;place-items:center;background:#f0f9ff;border:1px solid #bae6fd;border-radius:16px;font-size:42px;font-weight:900;user-select:none;color:#0f172a}
    .cell:active{transform:scale(.99)}
    .cell.win{background:#bbf7d0;border-color:#22c55e}
    .note{max-width:520px;margin:6px auto 16px;color:var(--muted);font-size:12px;padding:0 12px}

    .overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
    .overlay.show{display:flex}
    .panel{width:min(92vw,520px);border-radius:18px;overflow:hidden;background:#fff;border:1px solid rgba(0,0,0,.08);box-shadow:0 18px 60px rgba(0,0,0,.55)}
    .panel-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid rgba(0,0,0,.08);background:#eff6ff}
    .panel-head .title{font-weight:800;color:#0f172a}
    .panel-head .right{display:flex;gap:8px;align-items:center}
    .panel-body{position:relative;background:#000}
    .video-aspect{position:relative;width:100%;padding-top:177.78%}
    .video-aspect #player{position:absolute;inset:0;width:100%;height:100%}

    .btn{appearance:none;border:0;border-radius:10px;padding:8px 12px;background:var(--accent);color:#fff;font-weight:800}
    .btn.alt{background:transparent;color:var(--text);border:1px solid rgba(0,0,0,.18)}
  </style>
</head>
<body>
  <!-- Rest of HTML and JS code same as before -->
</body>
</html>
